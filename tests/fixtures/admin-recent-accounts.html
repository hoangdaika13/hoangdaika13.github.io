<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA ONLY · Admin accounts</title><link rel="stylesheet" href="../../community-admin.css"><link rel="stylesheet" href="../../admin-recent-accounts.css"><style>body{margin:0;padding:16px;background:#090f20;color:#e9edff;font-family:system-ui}button{min-height:44px}#qa{padding:12px;background:#43381a;margin-bottom:16px}.hh-admin-app{max-width:1440px;margin:auto}dialog{background:#101a2d;color:#fff}dialog form>main{max-height:65vh;overflow:auto;padding:16px}dialog form>header,dialog form>footer{padding:14px;display:flex;justify-content:space-between;gap:12px}iframe{display:block;border:0;height:1000px;max-width:100%}</style></head><body>
<div id="qa">QA ONLY — dữ liệu giả lập có nhãn, không kết nối tài khoản thật. <button id="empty">Dữ liệu rỗng</button> <button id="error">Lỗi API</button> <button id="normal">Bình thường</button> <button id="light">Sáng/tối</button> <button id="zoom">Chữ 200%</button> <a href="?width=375">375px</a> <a href="?width=768">768px</a> <a href="?width=1440">1440px</a></div><div id="panel"></div>
<script src="../../admin-recent-accounts.js"></script><script>
const params=new URLSearchParams(location.search); const width=Number(params.get('width'));
if(width){document.querySelector('#panel').innerHTML=`<iframe title="QA responsive ${width}px" width="${width}" src="admin-recent-accounts.html?embedded=1"></iframe>`;}else{
let mode='normal',review=false,reviewMeta={},notes=[],revoked=false; const at=new Date().toISOString(), id='650000000000000000000001';
const user={id,name:'QA Nguyễn An',email:'qa-only@example.invalid',roles:['member'],status:'active',provider:'google',lastLoginAt:at,lastActivityAt:at,activeSessions:2,failedLogins:1,securitySignals:1,workspace:'focus-room',device:'Máy tính',browser:'Chrome',platform:'Windows',region:'Chưa xác định',ip:'203.0.*.*',sessionState:'active',expiresAt:at,restrictedFeatures:[]};
const api=async(view,options={})=>{await new Promise(r=>setTimeout(r,80));if(options.signal?.aborted)throw Error('Đã hủy');if(view==='me')return {user:{id:'650000000000000000000099'}};if(mode==='error')throw Error('QA: máy chủ đang không khả dụng, hãy thử lại.');
if(view==='accounts-recent'){const q=options.query||{}, users=mode==='empty'||(q.q&&!user.name.includes(q.q))?[]:[{...user,review}];return {users,pagination:{page:Number(q.page||1),pages:1,limit:20,total:users.length},summary:{accounts:users.length,logins:3,sessions:revoked?1:2,failures:1,signals:1},canActivity:true,generatedAt:at,note:'QA ONLY — thống kê giả lập chỉ dùng kiểm thử giao diện. Không phải dữ liệu thật.'};}
if(view==='accounts-detail')return {user,canManage:true,canActivity:true,canRoles:true,canNotes:true,canAudit:true,canSupport:true,privacy:{analyticsConsent:true,personalizationConsent:false,updatedAt:at},review,reviewDetail:reviewMeta,notes,roleAssignments:[],accessGrants:[],effectivePermissions:['users.view'],support:[{id:'qa-ticket',source:'Helpdesk',status:'open',priority:'normal',createdAt:at}],events:[{id:'e1',type:'google-login',provider:'google',success:true,browser:'Chrome',platform:'Windows',region:'Chưa xác định',ip:'203.0.*.*',createdAt:at,newDevice:true},{id:'e2',type:'login',provider:'local',success:false,browser:'Firefox',platform:'Linux',createdAt:at}],sessions:[{id:'qa-session',state:revoked?'revoked':'active',current:false,browser:'Chrome',platform:'Windows',provider:'google',createdAt:at,lastSeenAt:at,expiresAt:at,region:'Chưa xác định',ip:'203.0.*.*'}],activity:[{module:'focus-room',createdAt:at}],audit:[{action:'QA: xem xét',admin:'QA Admin',reason:'Chỉ kiểm thử',createdAt:at}]};
if(view==='accounts-manage'){const b=options.body;if(b.action==='note:add')notes.push({id:'650000000000000000000010',text:b.text,authorId:'650000000000000000000099',createdAt:at});if(b.action==='note:edit')notes=notes.map(n=>n.id===b.noteId?{...n,text:b.text,updatedAt:at}:n);if(b.action==='review:set'){review=b.review;reviewMeta={...b,updatedAt:at};}if(b.action==='note:delete')notes=[];return {ok:true};}
if(view==='accounts-profile-export')return {ok:true,count:1,content:JSON.stringify({qaOnly:true,user})};
if(view==='action'){revoked=true;return {ok:true,revoked:true};}if(view==='accounts-export')return {ok:true,count:1,content:'QA ONLY export'};throw Error('QA endpoint không hỗ trợ');};
function modal(title,content,label){document.querySelector('dialog')?.remove();const d=document.createElement('dialog');d.className='hh-admin-modal';d.innerHTML=`<form><header><strong>${title}</strong><button type="button" aria-label="Đóng">×</button></header><main>${content}</main><footer><button type="submit">${label}</button></footer></form>`;document.body.append(d);d.querySelector('[aria-label="Đóng"]').onclick=()=>d.remove();d.addEventListener('cancel',()=>d.remove());d.showModal();return d;}
const app=HHAdminRecentAccounts.create({api,shell:content=>`<main class="hh-admin-app">${content}</main>`,modal,has:()=>true,panel:()=>document.querySelector('#panel')});app.render();
document.querySelector('#empty').onclick=()=>{mode='empty';app.render();};document.querySelector('#error').onclick=()=>{mode='error';app.render();};document.querySelector('#normal').onclick=()=>{mode='normal';app.render();};document.querySelector('#light').onclick=()=>document.body.dataset.theme=document.body.dataset.theme==='light'?'dark':'light';document.querySelector('#zoom').onclick=()=>document.documentElement.style.fontSize=document.documentElement.style.fontSize==='32px'?'16px':'32px';
}
</script></body></html>
