<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy graphics QA — local fixture</title>
<style>body{margin:0;background:#060b19;color:#e9f1ff;font:16px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:10px}#scene{height:560px;max-width:1100px;position:relative;touch-action:pan-y}canvas{width:100%;height:100%;display:block}output{display:block;padding:10px}#fallback{display:none}#scene[data-state=fallback] #fallback{display:block;padding:60px}#scene[data-state=fallback] canvas{display:none}</style>
<header><label>Cảnh <select id="route"><option value="map">Bản đồ</option><option value="ai">AI</option><option value="music">Music</option><option value="learning">Learning</option></select></label><label>Đồ họa <select id="quality"><option>balanced</option><option>economy</option><option>cinematic</option></select></label><button id="pause">Dừng / chạy</button><button id="active">Đóng / mở cảnh</button><button id="loss">Mất WebGL</button><button id="retry">Tạo lại</button><button id="destroy">Hủy cảnh</button></header>
<div id="scene" tabindex="0" role="group" aria-label="Cảnh kiểm thử 3D"></div><output id="status" role="status">Chuẩn bị</output>
<script type="module" src="galaxy-graphics-boot.mjs"></script></html>
