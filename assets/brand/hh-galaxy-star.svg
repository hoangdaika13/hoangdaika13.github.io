<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="hhGalaxyStarAnimatedTitle">
  <title id="hhGalaxyStarAnimatedTitle">HH Galaxy Star chuyển động</title>
  <defs>
    <radialGradient id="hhga-bg" cx="42%" cy="34%" r="76%">
      <stop offset="0" stop-color="#20225d"/>
      <stop offset=".48" stop-color="#11132f"/>
      <stop offset="1" stop-color="#080a18"/>
    </radialGradient>
    <linearGradient id="hhga-ring" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55e6ff"/>
      <stop offset=".36" stop-color="#9c72ff"/>
      <stop offset=".68" stop-color="#ff58c8"/>
      <stop offset="1" stop-color="#ffd76a"/>
    </linearGradient>
    <radialGradient id="hhga-star" cx="42%" cy="34%" r="68%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".26" stop-color="#fff4c7"/>
      <stop offset=".7" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#ff9f54"/>
    </radialGradient>
    <filter id="hhga-glow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .hhga-spin,.hhga-counter,.hhga-halo,.hhga-star,.hhga-glint{transform-box:view-box;transform-origin:center}
      .hhga-spin{animation:hhga-spin 12s linear infinite}
      .hhga-counter{animation:hhga-counter 17s linear infinite}
      .hhga-halo{animation:hhga-halo 3.2s ease-in-out infinite}
      .hhga-star{animation:hhga-star 3.4s ease-in-out infinite}
      .hhga-glint{animation:hhga-glint 5.8s ease-in-out infinite}
      @keyframes hhga-spin{to{transform:rotate(360deg)}}
      @keyframes hhga-counter{to{transform:rotate(-360deg)}}
      @keyframes hhga-halo{50%{opacity:.86;transform:scale(1.035)}}
      @keyframes hhga-star{50%{filter:brightness(1.18);transform:scale(1.025)}}
      @keyframes hhga-glint{0%,70%,100%{opacity:.16;transform:rotate(-18deg)}82%{opacity:.95;transform:rotate(16deg)}}
      @media (prefers-reduced-motion:reduce){.hhga-spin,.hhga-counter,.hhga-halo,.hhga-star,.hhga-glint{animation:none!important}}
    </style>
  </defs>
  <circle cx="64" cy="64" r="59" fill="url(#hhga-bg)" stroke="url(#hhga-ring)" stroke-width="3"/>
  <circle class="hhga-halo" cx="64" cy="64" r="49" fill="none" stroke="#9c72ff" stroke-width="7" opacity=".24" filter="url(#hhga-glow)"/>
  <g class="hhga-counter" opacity=".72">
    <path d="M22 71c19-27 57-39 84-18-21-5-39 0-53 10-11 8-19 13-31 8Z" fill="#9c72ff" opacity=".26"/>
    <path d="M25 78c25 12 61 4 78-24-7 27-35 48-64 39-7-2-12-7-14-15Z" fill="#55e6ff" opacity=".2"/>
  </g>
  <g class="hhga-spin">
    <ellipse cx="64" cy="64" rx="48" ry="18" fill="none" stroke="url(#hhga-ring)" stroke-width="2" opacity=".82" transform="rotate(-18 64 64)"/>
    <circle cx="19.5" cy="79.5" r="3.25" fill="#55e6ff" stroke="#fff" stroke-width="1.1"/>
    <circle cx="106" cy="49" r="2.6" fill="#ff58c8" stroke="#fff4c7" stroke-width="1"/>
  </g>
  <g class="hhga-star" filter="url(#hhga-glow)">
    <polygon points="64,24 69.74,50.14 87.33,40.67 77.86,58.26 97,64 77.86,69.74 87.33,87.33 69.74,77.86 64,97 58.26,77.86 40.67,87.33 50.14,69.74 31,64 50.14,58.26 40.67,40.67 58.26,50.14" fill="url(#hhga-star)" stroke="#fff8dc" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="64" cy="64" r="8.5" fill="#fff" opacity=".94"/>
    <circle cx="64" cy="64" r="3.2" fill="#fff"/>
  </g>
  <path class="hhga-glint" d="M48 91 77 34" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".16"/>
</svg>
